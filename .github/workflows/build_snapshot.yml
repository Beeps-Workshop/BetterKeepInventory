name: Snapshot build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Daily 10:00 UTC

jobs:
  # A nightly snapshot is the first build most people actually run, so it gates on the
  # end-to-end suite rather than only the unit tests.
  e2e:
    uses: ./.github/workflows/e2e.yml

  snapshot:
    needs: e2e
    uses: Beeps-Workshop/.github/.github/workflows/snapshot.yml@main
    with:
      build-system: maven
      project: bki
      jar-glob: plugin/target/BetterKeepInventory-*.jar
      loaders: |
        spigot
        paper
        purpur
        folia
      game-versions: |
        1.21.x
        26.x
      java-version: '21'
      force: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
