name: End-to-end Tests

# Boots a real Paper server with the plugin installed and drives it with a headless bot.
# Covers what MockBukkit cannot reach: real death mechanics, the keepInventory gamerule
# interaction, and where items and experience actually end up.
#
# The invariant that justifies the runtime: items kept plus items on the ground must equal
# items carried, across every default_behavior and gamerule combination. That is what the
# 2.3.2 dupe bug violated.
# .github/workflows/e2e.yml
on:
  push:
    # master only. A branch with an open PR is already covered by the pull_request trigger, and
    # listing it here just runs the whole thing twice for every push.
    branches: [master]
  pull_request:
    # Booting a Paper server to check a readme edit is three minutes of nothing. Note this makes
    # the check *absent* rather than passing on a PR that touches none of these -- so if it is
    # ever made a required check, a docs-only PR would wait forever for a run that never comes.
    paths:
      - 'plugin/**'
      - 'api/**'
      - 'e2e/**'
      - 'pom.xml'
      - 'scripts/get_paper_jar.sh'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A hung bot or a server that never finishes booting would otherwise sit until the
    # job-level default. A full run is ~1 minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Read from e2e/.nvmrc so a local `nvm use` and CI cannot drift apart.
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the plugin
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Download Paper
        run: ./scripts/get_paper_jar.sh paper 1.21.8

      - name: Install e2e dependencies
        # ci rather than install: the lockfile is committed precisely because mineflayer
        # tracks protocol versions and a drifting version would look like a plugin regression.
        working-directory: e2e
        run: npm ci

      - name: Run end-to-end tests
        working-directory: e2e
        run: npm test

      - name: Upload server log
        # The console log is the only way to tell a plugin failure from a server that never
        # came up, so keep it when something goes wrong.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-console-log
          path: e2e/.server/console.log
          if-no-files-found: warn
