# server.properties for the BetterKeepInventory e2e suite.
#
# This file is the template: run.js copies it into e2e/.server/ on every run, so
# anything the server rewrites at shutdown is thrown away and each run starts from
# exactly these values. Never edit e2e/.server/server.properties, edit this.
#
# Deliberate choices:
#  - enable-rcon + a password: the suite drives all setup/teardown over RCON.
#  - online-mode=false: mineflayer joins offline, without a Mojang account.
#  - level-type=flat: superflat generates in a fraction of the time of a real world.
#  - pause-when-empty-seconds=0: 1.21.2+ parks the server when no player is online,
#    which would freeze RCON setup issued before the bot connects.
#  - non-default ports: so a dev server on 25565/25575 can stay running alongside.

allow-flight=true
allow-nether=false
broadcast-console-to-ops=false
broadcast-rcon-to-ops=false
difficulty=easy
enable-command-block=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=true
enable-status=false
enforce-secure-profile=false
enforce-whitelist=false
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=4
gamemode=survival
generate-structures=false
generator-settings={}
hardcore=false
level-name=world
level-seed=bki-e2e
level-type=flat
log-ips=false
max-players=4
max-tick-time=-1
max-world-size=29999984
motd=BetterKeepInventory e2e
network-compression-threshold=-1
online-mode=false
op-permission-level=4
pause-when-empty-seconds=0
player-idle-timeout=0
pvp=true
rate-limit=0
rcon.password=bki-e2e-rcon
rcon.port=25576
require-resource-pack=false
server-ip=127.0.0.1
server-port=25566
simulation-distance=6
spawn-animals=false
spawn-monsters=false
spawn-npcs=false
spawn-protection=0
sync-chunk-writes=false
use-native-transport=true
view-distance=6
white-list=false
